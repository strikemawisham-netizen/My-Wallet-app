name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Uses the clean, upgraded python pipeline
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Packaging Tools
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libtinfo5 \
            libncurses5-dev \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Verified Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "Cython>=0.29.36,<3.0" buildozer virtualenv

      # Runs the native build clean without custom workspace injections
      - name: Compile Application
        run: |
          export NO_DOCKER=1
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-android-apk
          path: bin/*.apk
          
