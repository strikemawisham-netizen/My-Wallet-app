name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This action encapsulates the entire Android SDK, NDK, and compilation environment
      - name: Build APK with Buildozer Container
        uses: Substack/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-android-apk
          path: bin/*.apk
          
