name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Python Toolchain Dependencies
        run: |
          pip install --upgrade pip
          pip install "Cython>=0.29.36,<3.0" buildozer virtualenv

      - name: Prepare Local Directories
        run: mkdir -p bin .buildozer

      - name: Build Android Package
        run: |
          export NO_DOCKER=1
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-android-apk
          path: bin/*.apk
          
